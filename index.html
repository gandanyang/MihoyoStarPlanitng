<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>归星物语</title>
    <!-- 内联 favicon：避免浏览器请求 /favicon.ico 产生 404 噪音（探针 console 误报资源缺失） -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        /* 背景氛围化：FIT 缩放产生的黑边区域用夜空渐变填充（与观星主题一致），
         * 避免纯色黑边突兀；PC 网页居中时外部填充同理 */
        background: radial-gradient(ellipse at 50% 20%, #1c2340 0%, #141a30 55%, #0d1122 100%);
        font-family: sans-serif;
        /* 阻止移动端双指缩放与橡皮筋滚动 */
        touch-action: none;
        overscroll-behavior: none;
        /* 防止长按弹出系统菜单（iOS Safari） */
        -webkit-touch-callout: none;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #game-container {
        width: 100%;
        height: 100%;
        /* 作为 DOM HUD / 触控容器的定位上下文：确保 UI 跟随画布（画布居中时 UI 不偏到黑边区） */
        position: relative;
      }
      /* 方案 A（制作人拍板 2026-08-02）：移动端竖屏强制横屏提示
       * 纯 CSS：竖屏（portrait）时在游戏之上覆盖全屏提示层，旋转为横屏后自动消失。
       * 桌面端由 JS 在 body 加 .desktop 类禁用（避免开发者工具窄窗口误触发）。
       * v0.9 改进（2026-08-06）：去掉 pointer:coarse 依赖（部分安卓 WebView 不生效），
       * 改用 JS isTouchDevice() 精准判断 + CSS orientation 双保险。
       */
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: #171412;
        color: #ffd700;
        font-family: Arial, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      /* 竖屏时显示（JS 会在桌面端 body.desktop 上覆盖禁用） */
      @media (orientation: portrait) {
        #rotate-hint { display: flex; }
      }
      /* 桌面端强制隐藏（JS 检测 !isTouchDevice() 时加 .desktop） */
      body.desktop #rotate-hint { display: none !important; }
      #rotate-hint .rh-inner {
        padding: 24px;
        border: 2px solid rgba(255, 215, 0, 0.5);
        border-radius: 12px;
        background: rgba(255, 215, 0, 0.08);
      }
      #rotate-hint .rh-icon { font-size: 48px; display: inline-block; margin-bottom: 12px; animation: rh-rotate 2s ease-in-out infinite; }
      @keyframes rh-rotate { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
      #rotate-hint .rh-title { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
      #rotate-hint .rh-sub { font-size: 14px; color: #d8c2a0; }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="rotate-hint">
      <div class="rh-inner">
        <span class="rh-icon">📱↪️</span>
        <div class="rh-title">请旋转设备横屏游玩</div>
        <div class="rh-sub">本游戏为横屏体验</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
